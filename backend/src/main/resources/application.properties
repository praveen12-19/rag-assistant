# Server Configuration
server.port=${SERVER_PORT:8080}

# Automatically import .env file if present (native Spring Boot support)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Spring Application Name
spring.application.name=rag-assistant

# MySQL Database Configuration (Spring Data JPA)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rag_assistant?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Google AI Studio Gemini API Configuration
# Reads GEMINI_API_KEY from environment variable (simplest setup: no GCP project or service account needed)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-1.5-flash
spring.ai.google.genai.chat.options.temperature=0.0
spring.ai.google.genai.embedding.options.model=text-embedding-004

# RAG Knowledge Assistant Tuning
rag.chunk-size=500
rag.chunk-overlap=50
rag.top-k=3
rag.similarity-threshold=0.65
rag.vector-store.file-path=data/vector-store.json

# Multipart / PDF Upload Constraints
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Jackson JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
